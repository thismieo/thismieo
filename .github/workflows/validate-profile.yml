name: Validate profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate profile structure and content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          readme_path = Path("README.md")
          if not readme_path.is_file():
              raise SystemExit("README.md is missing")

          readme = readme_path.read_text(encoding="utf-8")
          if not readme.strip():
              raise SystemExit("README.md is empty")

          expected_assets = {"assets/profile-v3-hero.svg"}
          assets_directory = Path("assets")
          if not assets_directory.is_dir():
              raise SystemExit("assets directory is missing")

          actual_assets = {
              path.as_posix()
              for path in assets_directory.rglob("*")
              if path.is_file()
          }
          if actual_assets != expected_assets:
              missing = sorted(expected_assets - actual_assets)
              unexpected = sorted(actual_assets - expected_assets)
              raise SystemExit(
                  f"Profile asset inventory mismatch. Missing={missing}, unexpected={unexpected}"
              )

          referenced_assets = set(
              re.findall(r'\./(assets/profile-v3-[^"\s>]+\.svg)', readme)
          )
          if referenced_assets != expected_assets:
              raise SystemExit(
                  f"README asset references do not match expected assets: {referenced_assets}"
              )

          for asset in expected_assets:
              root = ET.parse(asset).getroot()
              if not root.tag.endswith("svg"):
                  raise SystemExit(f"Invalid SVG root element in {asset}")
              if "viewBox" not in root.attrib:
                  raise SystemExit(f"Missing viewBox in {asset}")
              text = Path(asset).read_text(encoding="utf-8")
              if "<title" not in text or "<desc" not in text:
                  raise SystemExit(f"Accessible title or description missing in {asset}")

          expected_root_files = {"README.md"}
          actual_root_files = {
              path.name for path in Path(".").iterdir() if path.is_file()
          }
          if actual_root_files != expected_root_files:
              raise SystemExit(
                  f"Unexpected root files: {sorted(actual_root_files - expected_root_files)}"
              )

          allowed_root_directories = {".git", ".github", "assets"}
          unexpected_directories = sorted(
              path.name
              for path in Path(".").iterdir()
              if path.is_dir() and path.name not in allowed_root_directories
          )
          if unexpected_directories:
              raise SystemExit(f"Unexpected root directories: {unexpected_directories}")

          workflow_files = {
              path.as_posix()
              for path in Path(".github/workflows").glob("*")
              if path.is_file()
          }
          expected_workflows = {".github/workflows/validate-profile.yml"}
          if workflow_files != expected_workflows:
              raise SystemExit(
                  f"Workflow inventory mismatch: {sorted(workflow_files)}"
              )

          required_links = (
              "https://thismieo.github.io",
              "https://github.com/thismieo/thismieo.github.io",
              "https://www.kaggle.com/thismieo",
              "mailto:thismieo@gmail.com",
          )
          missing_links = [link for link in required_links if link not in readme]
          if missing_links:
              raise SystemExit(f"Required profile links are missing: {missing_links}")

          forbidden_patterns = (
              "<table",
              "github-readme-stats",
              "komarev.com/ghpvc",
              "visitor-badge",
              ".gif",
              "profile-v2-",
          )
          found_forbidden = [item for item in forbidden_patterns if item in readme]
          if found_forbidden:
              raise SystemExit(f"Forbidden profile patterns found: {found_forbidden}")

          print("Minimal GitHub profile validated successfully.")
          PY

      - name: Check whitespace
        run: git diff --check
